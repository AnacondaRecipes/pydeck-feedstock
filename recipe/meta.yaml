{% set name = "pydeck" %}
{% set version = "0.9.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 695775cbfe51f5fdffbd9735ba469987fdc5efc96bc40a0ee4808170509c78b2

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<38]

requirements:
  host:
    - python 
    - pip
    - setuptools
    - wheel
  run:
    - python
    - jinja2 >=2.10.1
    - numpy >=1.16.4
  # Optional Jupyter dependencies are defined in upstream setup.py.
  # https://github.com/visgl/deck.gl/blob/master/bindings/pydeck/setup.py#L216-L218
  run_constrained:
    - ipywidgets >=7,<8
    - traitlets >=4.3.2
    - ipykernel >=5.1.2



test:
  source_files:
    - tests
  imports:
    - pydeck
    - pydeck.bindings
    - pydeck.data_utils
    - pydeck.io
    - pydeck.nbextension  # [py<314]
    # Jupyter widget requires optional ipywidgets 7.x dependencies,
    # which cannot be resolved on win-arm64 with Python 3.12/3.13.
    # https://deckgl.readthedocs.io/en/latest/installation.html#enabling-pydeck-for-jupyter
    - pydeck.widget       # [py<314 and not (win and arm64)]
  requires:
    - pip
    - pytest
    - pandas
    - ipython
    # Skip optional Jupyter dependencies on win-arm64: ipywidgets 7.x
    # cannot be resolved on Python 3.12/3.13 due to missing dependencies.
    - traitlets >=4.3.2   # [py<314 and not (win and arm64)]
    - ipywidgets >=7,<8   # [py<314 and not (win and arm64)]
    - ipykernel >=5.1.2   # [py<314 and not (win and arm64)]
  commands:
    - pip check
    # Browser tests require additional rendering infrastructure.
    # Notebook tests execute Jupyter notebooks and are not package-level tests.
    - pytest -v tests --ignore=tests/browser --ignore=tests/notebooks


about:
  home: https://github.com/visgl/deck.gl/tree/master/bindings/pydeck
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  summary: Widget for deck.gl maps
  description: |
    The pydeck library is a set of Python bindings for making spatial visualizations
    with deck.gl, optimized for a Jupyter environment.
  doc_url: https://deckgl.readthedocs.io/
  dev_url: https://github.com/visgl/deck.gl/tree/master/bindings/pydeck

extra:
  recipe-maintainers:
    - ajduberstein
