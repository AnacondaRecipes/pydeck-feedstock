{% set name = "pydeck" %}
{% set version = "0.9.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c10d9035e81ead6385264cac8d19402471f6866a15ca1f7df1400f52142bcf87

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<38]

requirements:
  host:
    - python 
    - pip
    - setuptools
    - wheel
  run:
    - python
    - jinja2 >=2.10.1
    - numpy >=1.16.4
  # https://github.com/visgl/deck.gl/blob/v9.1.0/bindings/pydeck/setup.py
  run_constrained:
    - traitlets >=4.3.2
    - ipywidgets >=7,<8
    - ipykernel >=5.1.2

test:
  imports:
    - pydeck
    - pydeck.bindings
    - pydeck.data_utils
    - pydeck.io
    - pydeck.nbextension  # [py<314]
    - pydeck.widget       # [py<314]
  requires:
    - pip
    - traitlets >=4.3.2   # [py<314]
    - ipywidgets >=7,<8   # [py<314]
    - ipykernel >=5.1.2   # [py<314]
  commands:
    - pip check

about:
  home: https://github.com/uber/deck.gl/tree/master/bindings/pydeck
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  summary: Widget for deck.gl maps
  description: |
    The pydeck library is a set of Python bindings for making spatial visualizations
    with deck.gl, optimized for a Jupyter environment.
  doc_url: https://pydeck.gl
  dev_url: https://github.com/uber/deck.gl/tree/master/bindings/pydeck

extra:
  recipe-maintainers:
    - ajduberstein
